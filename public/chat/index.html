<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat — AI Desk</title><style>:root{--ink:#172033;--muted:#718096;--line:#e4e9f1;--blue:#3167f5;--bg:#f7f9fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}.app{height:100vh;display:grid;grid-template-rows:70px 1fr 92px;max-width:1080px;margin:auto;background:#fff;box-shadow:0 0 50px #1d31520b}.bar{display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:11px;font-weight:750}.logo{display:grid;place-items:center;width:31px;height:31px;border-radius:9px;color:#fff;background:linear-gradient(135deg,#315cf5,#7c61ff)}.back{color:var(--muted);text-decoration:none;font-size:14px}.controls{display:flex;gap:8px}.controls select,.controls input{height:38px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:0 11px;color:var(--ink);font:inherit;font-size:13px;outline:none}.controls input{width:160px}.messages{padding:34px 8%;overflow:auto;background:linear-gradient(#fff,#fbfcfe)}.welcome{text-align:center;color:var(--muted);padding:8vh 0}.welcome .spark{font-size:34px}.welcome h1{color:var(--ink);font-size:24px;margin:15px 0 7px}.welcome p{margin:0}.bubble{max-width:min(680px,82%);padding:13px 17px;margin:14px 0;border-radius:16px;line-height:1.65;white-space:pre-wrap}.user{margin-left:auto;color:#fff;background:var(--blue);border-bottom-right-radius:5px}.assistant{background:#f0f3f8;border-bottom-left-radius:5px}.composer{display:flex;align-items:center;gap:10px;padding:18px 8%;border-top:1px solid var(--line);background:#fff}.composer input{flex:1;height:52px;border:1px solid var(--line);border-radius:13px;padding:0 17px;font:inherit;outline:none}.composer button{width:52px;height:52px;border:0;border-radius:13px;background:var(--blue);color:#fff;font-size:20px;cursor:pointer}@media(max-width:650px){.bar{padding:0 15px}.back{font-size:0}.back:after{content:'←';font-size:20px}.controls input{width:100px}.controls select{max-width:110px}.messages,.composer{padding-left:18px;padding-right:18px}}</style></head><body><div class="app"><header class="bar"><div><a class="back" href="/">← Portal</a><span style="margin:0 16px;color:#d8dee8">/</span><span class="brand"><span class="logo">✦</span> AI Desk</span></div><div class="controls"><select id="provider" aria-label="Provider"><option value="gemini">Gemini</option><option value="openai">OpenAI</option><option value="openai-compat">Custom gateway</option></select><input id="model" placeholder="Model (optional)" aria-label="Model"></div></header><main id="messages" class="messages"><div class="welcome" id="welcome"><div class="spark">✦</div><h1>พร้อมช่วยคุณแล้ว</h1><p>ถามอะไรก็ได้ เริ่มต้นบทสนทนาได้เลย</p></div></main><form id="form" class="composer"><input id="message" autocomplete="off" placeholder="เขียนข้อความของคุณ..." required><button aria-label="ส่งข้อความ">↑</button></form></div><script src="/chat/app.js"></script></body></html>
