<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roar Chat — AI Workspace</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');:root{--ink:#2d1a12;--muted:#8b7468;--line:#f0dccd;--orange:#ed7130;--cream:#fffaf5}*{box-sizing:border-box}body{margin:0;background:#fff4e9;color:var(--ink);font-family:'DM Sans',system-ui,sans-serif}.app{height:100vh;display:grid;grid-template-rows:76px 1fr 102px;max-width:1160px;margin:auto;background:#fffaf7;box-shadow:0 0 65px #9e4d1b12}.bar{display:flex;align-items:center;justify-content:space-between;padding:0 32px;border-bottom:1px solid var(--line);background:#fffdfb}.brand{display:flex;align-items:center;gap:10px;font-weight:700}.logo{display:grid;place-items:center;width:37px;height:37px;border-radius:12px;color:#fff;font-size:20px;background:linear-gradient(145deg,#ffad4d,#df5729);box-shadow:0 7px 18px #e9683533}.back{color:var(--muted);text-decoration:none;font-size:13px}.back:hover{color:var(--orange)}.divider{margin:0 14px;color:#ead5c8}.controls{display:flex;gap:8px}.controls select,.controls input{height:40px;border:1px solid var(--line);border-radius:11px;background:#fff;padding:0 12px;color:var(--ink);font:inherit;font-size:13px;outline:none}.controls select:focus,.controls input:focus,.composer input:focus{border-color:#ef9b6c;box-shadow:0 0 0 3px #f9bd9333}.controls input{width:160px}.messages{padding:38px 9%;overflow:auto;background:radial-gradient(circle at 90% 0,#fff0db,transparent 30%),linear-gradient(#fffaf7,#fffdfb)}.welcome{text-align:center;color:var(--muted);padding:9vh 0}.welcome .spark{font-size:42px;filter:drop-shadow(0 5px 5px #ec8a3c55)}.welcome h1{color:var(--ink);font-size:25px;margin:15px 0 7px}.welcome p{margin:0}.bubble{max-width:min(680px,82%);padding:14px 18px;margin:15px 0;border-radius:18px;line-height:1.7;white-space:pre-wrap;box-shadow:0 5px 17px #87401a0b}.user{margin-left:auto;color:#fff;background:linear-gradient(135deg,#f28a3b,#d95729);border-bottom-right-radius:6px}.assistant{background:#fff0e3;border:1px solid #f4d9c5;border-bottom-left-radius:6px}.composer{display:flex;align-items:center;gap:11px;padding:20px 9%;border-top:1px solid var(--line);background:#fffdfb}.composer input{flex:1;height:54px;border:1px solid var(--line);border-radius:15px;padding:0 18px;font:inherit;outline:none;background:#fff}.composer button{width:54px;height:54px;border:0;border-radius:15px;background:linear-gradient(145deg,#f59642,#d95729);color:#fff;font-size:21px;cursor:pointer;box-shadow:0 9px 19px #dc622d42;transition:.2s}.composer button:hover{transform:translateY(-2px);box-shadow:0 12px 23px #dc622d59}@media(max-width:650px){.bar{padding:0 16px}.back{font-size:0}.back:after{content:'←';font-size:21px}.divider{margin:0 9px}.controls input{width:98px}.controls select{max-width:112px}.messages,.composer{padding-left:18px;padding-right:18px}.messages{padding-top:25px}.bubble{max-width:90%}}
</style></head><body><div class="app"><header class="bar"><div><a class="back" href="/">← Portal</a><span class="divider">/</span><span class="brand"><span class="logo">🦁</span> Roar Chat</span></div><div class="controls"><select id="provider" aria-label="Provider"><option value="gemini">Gemini</option><option value="openai">OpenAI</option><option value="openai-compat">Custom gateway</option></select><input id="model" placeholder="Model (optional)" aria-label="Model"></div></header><main id="messages" class="messages"><div class="welcome" id="welcome"><div class="spark">🦁</div><h1>พร้อมลุยไปกับคุณ</h1><p>ถามอะไรก็ได้ แล้วให้สิงโตช่วยคำรามไอเดียออกมา</p></div></main><form id="form" class="composer"><input id="message" autocomplete="off" placeholder="เขียนข้อความของคุณ..." required><button aria-label="ส่งข้อความ">↑</button></form></div><script src="/chat/app.js"></script></body></html>
