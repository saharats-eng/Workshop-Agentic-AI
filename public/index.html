<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Desk — Workspace</title><style>:root{--ink:#142033;--muted:#667085;--line:#e6eaf0;--blue:#3167f5}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 85% 0,#e8efff,transparent 32%),#fbfcfe}.shell{max-width:1120px;margin:auto;padding:28px 24px 70px}.nav{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:10px;font-weight:750}.logo{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;color:#fff;background:linear-gradient(135deg,#315cf5,#7c61ff)}.status{font-size:13px;color:#3a8062;background:#ecf8f1;padding:8px 12px;border-radius:999px}.hero{padding:105px 0 70px;max-width:720px}.eyebrow{color:var(--blue);font-size:13px;font-weight:700;letter-spacing:.11em;text-transform:uppercase}.hero h1{font-size:clamp(42px,7vw,76px);line-height:1.02;letter-spacing:-.065em;margin:16px 0 22px}.hero p{font-size:19px;line-height:1.7;color:var(--muted);max-width:600px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:25px;text-decoration:none;color:inherit;transition:.2s;box-shadow:0 12px 35px #263b6208}.card:hover{transform:translateY(-5px);border-color:#bdcaff;box-shadow:0 18px 45px #315cf51c}.icon{font-size:27px}.card h2{font-size:20px;margin:18px 0 8px}.card p{color:var(--muted);line-height:1.6;margin:0}.arrow{display:block;margin-top:22px;color:var(--blue);font-weight:700}@media(max-width:600px){.shell{padding:20px 18px}.hero{padding:78px 0 48px}.hero p{font-size:17px}}</style></head><body><main class="shell"><nav class="nav"><div class="brand"><span class="logo">✦</span> AI Desk</div><span class="status">● Workspace ready</span></nav><section class="hero"><div class="eyebrow">Your intelligent workspace</div><h1>คิดให้ไกล<br><span style="color:#3167f5">ทำงานให้ไวขึ้น</span></h1><p>พื้นที่ทำงาน AI ที่เรียบง่ายและทรงพลัง เริ่มต้นสนทนาเพื่อเปลี่ยนไอเดียให้เป็นผลลัพธ์</p></section><section class="grid"><a class="card" href="/chat/"><div class="icon">💬</div><h2>หน้าต่าง Chat</h2><p>สนทนากับ Gemini, OpenAI หรือ Custom gateway ได้จากพื้นที่เดียว</p><span class="arrow">เริ่มสนทนา&nbsp; →</span></a></section></main></body></html>
